<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">坐直小伙伴功能预览</title>
  <desc id="desc">显示坐姿评分、久坐提醒和透明猫猫宠物的产品插图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#393163"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1000" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="875" cy="70" r="150" fill="#6d5bd0" opacity=".18"/>
  <circle cx="85" cy="390" r="180" fill="#12a474" opacity=".12"/>
  <text x="62" y="78" fill="#fff" font-size="34" font-weight="700" font-family="Microsoft YaHei UI, sans-serif">坐直小伙伴</text>
  <text x="62" y="115" fill="#cdd2e8" font-size="17" font-family="Microsoft YaHei UI, sans-serif">本地姿势识别 · 久坐提醒 · 透明桌面宠物</text>
  <g filter="url(#shadow)">
    <rect x="62" y="150" width="550" height="218" rx="22" fill="#fff"/>
    <text x="92" y="190" fill="#667085" font-size="15" font-family="Microsoft YaHei UI, sans-serif">实时未坐直分数</text>
    <text x="92" y="260" fill="#12a474" font-size="62" font-weight="700" font-family="Segoe UI, sans-serif">18</text>
    <text x="92" y="292" fill="#12a474" font-size="16" font-weight="700" font-family="Microsoft YaHei UI, sans-serif">坐得直直的，继续保持</text>
    <g font-family="Microsoft YaHei UI, sans-serif" font-size="13" fill="#667085">
      <text x="300" y="198">整体高度</text><rect x="300" y="209" width="260" height="9" rx="5" fill="#eaecf0"/><rect x="300" y="209" width="58" height="9" rx="5" fill="#5b5fef"/>
      <text x="300" y="246">头部靠近</text><rect x="300" y="257" width="260" height="9" rx="5" fill="#eaecf0"/><rect x="300" y="257" width="33" height="9" rx="5" fill="#5b5fef"/>
      <text x="300" y="294">肩膀下沉</text><rect x="300" y="305" width="260" height="9" rx="5" fill="#eaecf0"/><rect x="300" y="305" width="46" height="9" rx="5" fill="#5b5fef"/>
    </g>
  </g>
  <g transform="translate(660 52)" filter="url(#shadow)">
    <rect x="28" y="0" width="220" height="68" rx="20" fill="#f0edff"/>
    <path d="M137 68l12 18 12-18" fill="#f0edff"/>
    <text x="138" y="41" text-anchor="middle" fill="#40356d" font-size="16" font-weight="700" font-family="Microsoft YaHei UI, sans-serif">一起抬头坐直吧！</text>
    <ellipse cx="138" cy="327" rx="88" ry="13" fill="#0d1120" opacity=".25"/>
    <path d="M94 246 Q47 210 58 286" fill="none" stroke="#c77938" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="139" cy="246" rx="55" ry="77" fill="#f2a65a" stroke="#c77938" stroke-width="3"/>
    <ellipse cx="139" cy="257" rx="30" ry="47" fill="#fff3df"/>
    <path d="M103 153l9-46 29 34M175 153l-9-46-29 34" fill="#f2a65a" stroke="#c77938" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="139" cy="164" rx="55" ry="52" fill="#f2a65a" stroke="#c77938" stroke-width="3"/>
    <ellipse cx="139" cy="181" rx="28" ry="22" fill="#fff3df"/>
    <circle cx="117" cy="158" r="5" fill="#302a36"/><circle cx="161" cy="158" r="5" fill="#302a36"/>
    <path d="M139 174l-6 6h12z" fill="#9a5e5e"/>
    <path d="M139 180q-8 12-16 0M139 180q8 12 16 0" fill="none" stroke="#6d4545" stroke-width="2"/>
    <path d="M115 307l-8 24M162 307l8 24" stroke="#c77938" stroke-width="11" stroke-linecap="round"/>
    <rect x="54" y="337" width="170" height="38" rx="19" fill="#6d5bd0"/>
    <text x="139" y="362" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Microsoft YaHei UI, sans-serif">Ⅱ 暂停摄像头</text>
  </g>
