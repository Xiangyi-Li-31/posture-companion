name: 功能建议
description: 提议新的提醒、宠物动作或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述使用场景，而不仅是具体实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私影响
      description: 是否需要新增联网、保存画面或采集数据？如果不需要，请写“无”。
    validations:
      required: true
