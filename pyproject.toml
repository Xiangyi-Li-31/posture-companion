[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-companion"
version = "0.5.0"
description = "Local-first posture, break reminder, and daily todo desktop app"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe>=1.0.1,<2",
  "opencv-contrib-python>=5,<6",
  "Pillow>=10,<13",
  "pystray>=0.19.5,<1",
  "windows-toasts>=1.3.1,<2",
]

[project.scripts]
posture-companion = "posture_companion.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
